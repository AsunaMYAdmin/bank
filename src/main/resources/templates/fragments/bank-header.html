<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
<header class="header" th:fragment="bank-header(activePage)">
    <div class="container header-container">
        <div class="logo">
            <span class="logo-icon">⛁</span>
            <span class="logo-text">Кристальный Банк</span>
        </div>
        <nav class="nav">
            <a href="/" class="nav-link" th:classappend="${activePage == 'bank-home'} ? 'active' : ''">Главная</a>
            <a href="/accounts" class="nav-link" th:classappend="${activePage == 'accounts'} ? 'active' : ''">Счета</a>
            <a href="/transactions" class="nav-link" th:classappend="${activePage == 'transactions'} ? 'active' : ''">Операции</a>
            <a href="/exchange" class="nav-link" th:classappend="${activePage == 'exchange'} ? 'active' : ''">Обмен валют</a>
            <a href="/bank-about" class="nav-link" th:classappend="${activePage == 'bank-about'} ? 'active' : ''">О банке</a>
            <a href="https://loregard.ru" class="nav-link" th:classappend="${activePage == 'loregard.ru'} ? 'active' : ''">LOREGARD</a>
        </nav>
        <div class="header-actions">
            <!-- Блок для авторизованного пользователя (не аноним) -->
            <div sec:authorize="isAuthenticated()" class="auth-actions">
                <span class="user-greeting" sec:authentication="name">Пользователь</span>
                <!-- Форма для выхода (POST с CSRF) -->
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-outline">
                        <span class="btn-icon">👋</span>
                        <span class="btn-text">Выйти</span>
                    </button>
                </form>
            </div>

            <!-- Блок для неавторизованного пользователя (аноним) -->
            <div sec:authorize="!isAuthenticated()" class="guest-actions">
                <a href="/login" class="btn btn-primary">Войти в банк</a>
            </div>
        </div>
    </div>

    <!-- CSRF токен в meta для AJAX запросов (опционально) -->
    <meta name="_csrf" th:content="${_csrf.token}" th:if="${_csrf}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}" th:if="${_csrf}"/>
</header>
</body>
</html>
